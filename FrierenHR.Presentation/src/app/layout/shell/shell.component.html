<div class="shell">
  <!-- Catches the tap outside the drawer. -->
  <div class="scrim" [class.open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <div class="brand-mark"><i class="pi pi-sitemap"></i></div>
      <span>FrierenHR</span>
      <button class="drawer-close" type="button" (click)="closeMenu()" aria-label="Close menu">
        <i class="pi pi-times"></i>
      </button>
    </div>
    <nav id="app-nav">
      @for (item of navItems; track item.path) {
        @if (visible(item)) {
          <a [routerLink]="item.path" routerLinkActive="active" class="nav-link"
             [class.setup-target]="isSetupTarget(item)">
            <i [class]="item.icon"></i><span>{{ item.label }}</span>
            @if (isSetupTarget(item)) {
              <span class="setup-dot" aria-label="Next setup step"></span>
            }
            @if (showsUnread(item)) {
              <span class="nav-badge" [attr.aria-label]="unreadMessages() + ' unread conversation(s)'">
                {{ unreadMessages() }}
              </span>
            }
          </a>
        }
      }
    </nav>
    <div class="sidebar-footer">
      <button class="nav-link" type="button" (click)="logout()">
        <i class="pi pi-sign-out"></i><span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" type="button" (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()" aria-label="Menu" aria-controls="app-nav">
        <i class="pi pi-bars"></i>
      </button>
      <div class="search">
        <i class="pi pi-search"></i>
        <input type="text" placeholder="Search…" />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="Notifications">
          <i class="pi pi-bell"></i>
        </button>
        <div class="divider"></div>
        <a class="user" routerLink="/profile">
          <div class="avatar">{{ initials() }}</div>
          <div class="user-meta">
            <span class="welcome">{{ authService.currentFullName() }}</span>
            <span class="role-badge">{{ authService.currentRole() }}</span>
          </div>
        </a>
      </div>
    </header>
    <!-- Above the content, so moving between setup steps never needs a trip back to the dashboard. -->
    <app-setup-banner />

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
