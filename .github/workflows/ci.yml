name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FrierenHR.slnx

      - name: Build
        run: dotnet build FrierenHR.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FrierenHR.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrierenHR.Presentation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FrierenHR.Presentation/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production
